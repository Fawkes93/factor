# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Secrets (dashboard only — sync: false):
#   WEBHOOK_SECRET, FACTOR_ADMIN_TOKEN
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   FACTOR_TOKEN_ENC_KEY, FACTOR_SESSION_SECRET, CTRADER_REDIRECT_URI
#   CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET
#
# Multi-user only: users OAuth cTrader; orders fan out from Reaktor webhooks.
# Product defaults (SL/TP presets, BE, market-open blackout) live in factor/config.py.
# See docs/DEPLOY.md, docs/MULTIUSER.md, docs/CTRADER.md

services:
  - type: web
    name: factor
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m factor
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BROKER
        value: ctrader
      - key: CTRADER_HOST
        value: demo
      - key: CTRADER_DRY_RUN
        value: "true"
      - key: TRADING_ENABLED
        value: "false"
      - key: WEBHOOK_SECRET
        sync: false
      - key: FACTOR_ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACTOR_TOKEN_ENC_KEY
        sync: false
      - key: FACTOR_SESSION_SECRET
        sync: false
      - key: CTRADER_REDIRECT_URI
        sync: false
      - key: CTRADER_CLIENT_ID
        sync: false
      - key: CTRADER_CLIENT_SECRET
        sync: false

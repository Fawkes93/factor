# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Secrets (set in dashboard):
#   WEBHOOK_SECRET, REAKTOR_BASE_URL, REAKTOR_API_KEY, FACTOR_ADMIN_TOKEN
#   CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN, CTRADER_ACCOUNT_ID
#
# Keep TRADING_ENABLED=false until cTrader credentials + a dry-run test work.
# See docs/DEPLOY.md and docs/CTRADER.md

services:
  - type: web
    name: factor
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m factor
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BROKER
        value: ctrader
      - key: CTRADER_HOST
        value: demo
      - key: CTRADER_DRY_RUN
        value: "true"
      - key: TRADING_ENABLED
        value: "false"
      - key: TRADE_KINDS
        value: candle
      - key: TRADE_SYMBOLS
        value: XAU/USD
      - key: POLL_INTERVAL_SEC
        value: "60"
      - key: CATCHUP_ON_START
        value: "true"
      - key: MAX_OPEN_PER_SYMBOL
        value: "1"
      - key: MAX_TRADES_PER_DAY
        value: "10"
      - key: COOLDOWN_SEC
        value: "300"
      - key: WEBHOOK_SECRET
        sync: false
      - key: REAKTOR_BASE_URL
        sync: false
      - key: REAKTOR_API_KEY
        sync: false
      - key: FACTOR_ADMIN_TOKEN
        sync: false
      - key: CTRADER_CLIENT_ID
        sync: false
      - key: CTRADER_CLIENT_SECRET
        sync: false
      - key: CTRADER_ACCESS_TOKEN
        sync: false
      - key: CTRADER_ACCOUNT_ID
        sync: false
